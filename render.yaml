services:
  - type: web
    name: arynik-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arynik-db
          property: connectionString
      - key: POSTIS_BASE_URL
        value: https://shipments.postisgate.com
      - key: POSTIS_USERNAME
        sync: false
      - key: POSTIS_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: APP_GEOCODER_PROVIDER
        value: google_then_nominatim
      - key: APP_GOOGLE_GEOCODER_MIN_DELAY_MS
        value: "80"
      - key: APP_GOOGLE_GEOCODER_FAST_MIN_DELAY_MS
        value: "40"
      - key: APP_GEOCODER_FAST_MIN_DELAY_MS
        value: "220"
      - key: CORS_ALLOWED_ORIGINS
        value: https://arynik.anunta.eu,https://anunta.eu
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SYNC_POSTIS
        value: "1"
      - key: AUTO_SYNC_POSTIS_RUN_IMMEDIATELY
        value: "0"
      - key: AUTO_SYNC_POSTIS_INTERVAL_SECONDS
        value: "3600"
      - key: AUTO_SYNC_POSTIS_USE_V2_LIST
        value: "0"
      - key: AUTO_SYNC_POSTIS_MAX_AWBS_PER_RUN
        value: "1500"
      - key: AUTO_SYNC_POSTIS_ENRICH_MISSING_FIELDS
        value: "1"

databases:
  - name: arynik-db
    databaseName: arynik
    user: arynik
